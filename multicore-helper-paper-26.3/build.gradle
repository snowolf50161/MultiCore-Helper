plugins { id 'java' }
group = 'com.example.multicorehelper'
version = '1.0.0'
base { archivesName = 'multicore-helper-paper-26.3' }
repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}
dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.218-stable'
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
processResources { filesMatching('plugin.yml') { expand(version: project.version) } }
test { useJUnitPlatform() }
