plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'eclipse'
    id 'maven-publish'
}

version = '1.0.1'
group = 'com.example.forcedmulticore'
base {
    archivesName = 'multicore-helper-forge-1.19.4'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.19.4'

    runs {
        client {
            workingDirectory project.file('run')
            if (project.findProperty('compatSmoke') == 'true') {
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
            }
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                forcedmulticore {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                forcedmulticore {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    if (findProperty('compatSmoke') == 'true') {
        flatDir { dirs 'compat-libs' }
    }
    mavenCentral()
    maven {
        url = 'https://libraries.minecraft.net/'
        content { includeGroup 'com.mojang' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.19.4-45.1.0'
    testImplementation 'junit:junit:4.13.2'
    if (findProperty('compatSmoke') == 'true') {
        runtimeOnly fg.deobf('local.compat:oculus:1.5.2')
        runtimeOnly fg.deobf('local.compat:rubidium:0.6.4')
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_version: version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE')
    manifest {
        attributes([
                'Specification-Title'     : 'forcedmulticore',
                'Specification-Vendor'    : 'snowolf50161',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'snowolf50161',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaExec).configureEach {
    if (name == 'runServer') {
        standardInput = System.in
    }
}
