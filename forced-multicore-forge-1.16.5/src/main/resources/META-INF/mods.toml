credits="Built locally for Minecraft Forge 1.16.5"
authors="snowolf50161"
description='''
Adds CPU utility features for Minecraft Forge 1.16.5 modpacks.

This mod creates a capped low-priority worker thread pool for safe background work, reports CPU usage in F3,
and adds entity pressure diagnostics/cleanup tools for large singleplayer or server worlds.

It does not rewrite Minecraft's main-thread world tick into a fully parallel engine.
'''

